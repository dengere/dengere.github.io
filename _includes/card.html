{% assign item = include.item %}
<article>
  {% case item.collection %}
    {% when 'courses' %}
      {% include home-card-course.html item=item %}
    {% when 'announcements' %}
      {% include home-card-announce.html item=item %}
    {% else %}
      {% include home-card-source.html item=item %}
  {% endcase %}
</article>
